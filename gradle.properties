org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# Keep the test APKs installed so the runtime collector can pull the original
# instrumentation screenshots, including the AR/EN/day/night/font-size matrix.
# Post-test reinstall captures are not a substitute for these per-variant files.
# Same AGP option is used by AndroidX's playground-common/androidx-shared.properties.
android.injected.androidTest.leaveApksInstalledAfterRun=true
